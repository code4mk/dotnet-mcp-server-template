name: publish

# Publishes to nuget.org on tags like v1.2.0, or manually (Actions → publish → Run workflow → version).
# Needs the repository secret NUGET_API_KEY (Push scope, glob Code4mk.*). See nuget-publish.md.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, e.g. 1.1.0"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.0 or 1.2.0-preview.1"; exit 1
          fi
          dotnet pack TemplatePack.csproj -c Release -o artifacts -p:PackageVersion=$VERSION
      - name: Package contains no local-only files
        run: |
          if unzip -l artifacts/*.nupkg | awk '{print $4}' | grep -E '(^|/)\.env(\..+)?$|(^|/)\.data/' | grep -v '\.env\.example$'; then
            echo "::error::The package contains a .env file or .data/ sign-in data"; exit 1
          fi
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
