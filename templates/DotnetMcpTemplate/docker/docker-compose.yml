# From the repository root:
#   cp .env.example .env
#   docker compose -f docker/docker-compose.yml up --build
# The container listens on APP_PORT and is published on the same host port.

name: dotnetmcptemplate-slug

services:
  mcp:
    image: dotnetmcptemplate-slug:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      APP_PORT: ${APP_PORT:-5080}
      AUTH_STORE_PATH: /data/auth   # on the volume below; wins over the local path in .env
    ports:
      - "${APP_PORT:-5080}:${APP_PORT:-5080}"
    volumes:
      - auth-data:/data   # AUTH_STORE=file: sign-ins survive restarts and re-deploys
    restart: unless-stopped

  # Uncomment to share sign-ins between instances: set AUTH_STORE=redis and REDIS_URL=redis://redis:6379 in .env
  # (docs/development/redis.md). The volume keeps sign-ins across Redis restarts.
  # redis:
  #   image: redis:7-alpine
  #   command: ["redis-server", "--appendonly", "yes"]
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped

volumes:
  auth-data:
  # redis-data:
